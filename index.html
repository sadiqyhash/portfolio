<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <title>Sadiq Al-Harasi — Visual Storyteller</title>
  <meta name="description" content="Sadiq Al-Harasi — Visual Storyteller.">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      min-height: 100svh;
      background: #080808;
      color: #f2f0ea;
      font-family: Arial, Helvetica, sans-serif;
    }
    .entry {
      position: relative;
      isolation: isolate;
      display: flex;
      align-items: flex-end;
      min-height: 100vh;
      min-height: 100svh;
      width: 100%;
      overflow: hidden;
      background: #080808;
    }
    .entry-image {
      position: absolute;
      inset: 0;
      z-index: -2;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }
    .entry::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background: linear-gradient(
        180deg,
        rgba(0,0,0,0.02) 30%,
        rgba(0,0,0,0.12) 52%,
        rgba(0,0,0,0.72) 100%
      );
    }
    .entry-content {
      width: 100%;
      padding: clamp(28px, 6vw, 84px);
      padding-bottom: max(clamp(32px, 7vh, 76px), env(safe-area-inset-bottom));
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 5.3vw, 4.5rem);
      line-height: 1.05;
      font-weight: 400;
      letter-spacing: -0.045em;
    }
    .title {
      margin: 12px 0 28px;
      color: rgba(242,240,234,0.86);
      font-size: clamp(0.9rem, 1.4vw, 1.05rem);
      letter-spacing: 0.035em;
    }
    .enter {
      display: inline-flex;
      min-width: 116px;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      padding: 10px 25px;
      border: 1px solid rgba(242,240,234,0.82);
      color: #f2f0ea;
      background: rgba(8,8,8,0.12);
      font-size: 0.82rem;
      letter-spacing: 0.06em;
      text-decoration: none;
      transition: background-color 180ms ease, color 180ms ease;
    }
    .enter:hover, .enter:focus-visible {
      color: #080808;
      background: #f2f0ea;
    }
    .enter:focus-visible {
      outline: 2px solid #f2f0ea;
      outline-offset: 4px;
    }
    @media (max-width: 600px) {
      .entry-image { object-position: center; }
      .entry-content { padding: 26px; padding-bottom: max(34px, env(safe-area-inset-bottom)); }
      h1 { font-size: clamp(2.1rem, 10vw, 3.2rem); }
      .title { margin-top: 10px; margin-bottom: 24px; }
      .enter { min-width: 108px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .enter { transition: none; }
    }
  </style>
</head>
<body>
  <main class="entry">
    <img
      class="entry-image"
      src="images/SYH07245.jpg"
      alt=""
      fetchpriority="high"
    >
    <div class="entry-content">
      <h1>Sadiq Al-Harasi</h1>
      <p class="title">Visual Storyteller</p>
      <a class="enter" href="fathers.html">Enter</a>
    </div>
  </main>
</body>
</html>
